<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <title>404 — zurai02</title>

  <!-- Instant Custom Shortlink Redirects (case-insensitive) -->
  <script>
  (function() {
    var REDIRECTS = {
      'github': 'https://github.com/zurai02',
      'repositories': 'https://github.com/zurai02?tab=repositories',
      'repos': 'https://github.com/zurai02?tab=repositories',
      'stars': 'https://github.com/zurai02?tab=stars',
      'portfolio': 'https://devforum.roblox.com/t/zurai02-scripting-portfolio/4679442',
      'devforum': 'https://devforum.roblox.com/u/zurai02',
      'discord': 'https://discord.com/users/1460949263650652200'
    };
    try {
      var segs = (window.location.pathname || '').replace(/^\/+|\/+$/g, '').split('/');
      var key = (segs[0] || '').toLowerCase();
      if (REDIRECTS[key]) {
        window.location.replace(REDIRECTS[key]);
        return;
      }
      var host = window.location.hostname;
      if (host && host !== 'zurai02.is-a.dev' && host.indexOf('localhost') === -1) {
        window.location.replace('https://zurai02.is-a.dev' + window.location.pathname + window.location.search + window.location.hash);
      }
    } catch (e) {}
  })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
