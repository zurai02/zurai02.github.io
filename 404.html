<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#ff6b35" />
  <title>404 — Page Not Found // zurai02</title>

  <!-- Fonts matching zurai02.is-a.dev -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Canonical host redirect (synchronous, root-relative so it works at any 404 path) -->
  <script src="/redirect.js"></script>

  <!-- Shared styles -->
  <link rel="stylesheet" href="/style.css?v=ui-v14" />
</head>
<body class="page-404">

  <!-- Particle background (same canvas index.html uses; wasm.js draws into it) -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="nf-glow" aria-hidden="true"></div>
  <div id="cursor-glow" aria-hidden="true"></div>

  <main class="nf-card" id="nf-card">
    <div class="nf-badge-row">
      <span class="nf-tag">
        <span class="nf-dot"></span>
        <span id="nf-badge-text">404 // NOT_FOUND</span>
      </span>
    </div>
    <div class="nf-number" aria-hidden="true">404</div>
    <h1 id="nf-title">Page Not Found</h1>
    <p id="nf-msg">The requested path <code class="nf-path" id="nf-path"></code> does not exist, has been moved, or is temporarily unavailable.</p>
    <div class="nf-actions">
      <a href="/" class="btn btn-primary">
        Return Home <span class="btn-arrow">→</span>
      </a>
      <a href="/#skills" class="btn btn-ghost">View Skills</a>
      <a href="javascript:history.back()" class="btn btn-ghost">Go Back</a>
    </div>
  </main>

  <noscript>
    <style>#nf-path { display: none; }</style>
  </noscript>

  <!-- Particle engine (same script and order as index.html: wasm.js before site.js) -->
  <script src="/wasm.js" defer></script>

  <!-- Tap/click burst effect -->
  <script src="/tapfx.js" defer></script>

  <!-- 404 logic (path display + cursor glow) -->
  <script src="/notfound.js?v=ui-v14" defer></script>
</body>
</html>
