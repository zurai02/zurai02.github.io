name: AI PR Guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai-pr-check:
    name: Detect AI-generated PR
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}

    steps:
      - name: Detect AI PR
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = [
              pr.title || '',
              pr.body || '',
              pr.head?.label || '',
              pr.user?.login || ''
            ].join('\n').toLowerCase();

            const aiKeywords = [
              'copilot',
              'openai',
              'chatgpt',
              'gpt',
              'claude',
              'anthropic',
              'gemini',
              'cursor',
              'generated by ai',
              'ai-generated',
              'created by ai',
              'autogenerated',
              'llm',
              'machine generated',
              'ai assisted',
              'generated with ai',
              'generated using ai',
              'using ai to write',
              'written by ai'
            ];

            const matches = aiKeywords.filter((keyword) => text.includes(keyword));
            const isAi = matches.length > 0;

            core.setOutput('is_ai', String(isAi));
            core.setOutput('matches', matches.join(', ') || 'none');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = pr.number;
            const labelName = 'AI';

            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: 'd93f0b',
                  description: 'Pull request generated or assisted by AI'
                });
              } else {
                throw error;
              }
            }

            if (isAi) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: [labelName]
              });

              core.info(`AI PR detected. Matches: ${matches.join(', ')}`);
              core.setFailed('AI-generated pull request detected. This PR has been labeled "AI" and blocked.');
            } else {
              core.info('No AI markers found in PR metadata.');
            }
