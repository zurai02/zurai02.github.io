[package]
name    = "particle-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]   # required for WASM output

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level     = 3      # maximum optimisation
lto           = true   # link-time optimisation — smaller, faster binary
codegen-units = 1      # single codegen unit for better LTO
panic         = "abort" # removes panic machinery — shrinks WASM size
