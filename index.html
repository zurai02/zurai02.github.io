<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zurai02</title>
    <meta
      name="description"
      content="Roblox Scripting & Engine Optimization — building fast, resilient systems and Luau tooling."
    />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div id="cursor-glow" aria-hidden="true"></div>
    <div id="cursor-star" aria-hidden="true"></div>
    <div id="cursor-star-layer" aria-hidden="true"></div>

    <div class="page">
      <header class="topbar">
        <div class="nav-shell">
          <a href="#" class="brand" aria-label="zurai02 home">
            <span class="brand-mark"></span>
            <span>zurai02</span>
          </a>

          <nav id="nav" class="nav" aria-label="Main navigation">
            <a href="#home" class="active">Home</a>
            <a href="#about">About</a>
            <a href="#work">Work</a>
            <a href="#contact">Contact</a>
          </nav>
        </div>
      </header>

      <main class="hero">
        <div class="hero-copy">
          <div class="eyebrow">Available for work</div>

          <h1 class="hero-title">
            <span>Hi, I’m</span><br />
            <span class="accent">zurai02</span>
          </h1>

          <p id="hero-sub" class="hero-sub"></p>

          <div class="cta-row">
            <a href="#about" class="btn primary">About Me</a>
            <a href="#contact" class="btn secondary">Get in Touch</a>
          </div>
        </div>

        <div class="hero-visual">
          <div class="avatar-ring">
            <div class="avatar"></div>
          </div>
        </div>
      </main>

      <div class="dns-toggle-wrap">
        <button id="dns-toggle" class="dns-toggle" type="button" aria-expanded="true">Hide DNS Terminal</button>
      </div>

      <section id="dns-panel" class="dns-panel open" aria-label="DNS lookup terminal">
        <div class="dns-header">
          <span>DNS Lookup</span>
          <span>DoH • browser-side</span>
        </div>
        <div id="term-out" class="term-output" aria-live="polite"></div>
        <form id="term-form" class="term-form">
          <span id="term-prompt" class="term-prompt">zurai02@portfolio:~$</span>
          <input id="term-in" type="text" autocomplete="off" spellcheck="false" aria-label="DNS command" placeholder="Try: dig github.com AAAA" />
        </form>
      </section>
    </div>

    <script src="site.js" defer></script>
  </body>
</html>
